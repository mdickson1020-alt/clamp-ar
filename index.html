<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bench Clamp AR Prototype 5.9</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif}
#hud{position:fixed;z-index:10000;left:10px;right:10px;top:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.68);color:#fff;font-size:14px;pointer-events:none}
#status{font-weight:700}.small{font-size:12px;opacity:.82;margin-top:4px}#diag{font:11px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.95;margin-top:6px;white-space:pre-wrap}
#display-video{
 position:fixed!important;inset:0!important;
 width:100vw!important;height:100vh!important;
 object-fit:cover!important;
 z-index:0!important;
 background:#000;
}
#arjs-video{
 position:fixed!important;
 width:1px!important;height:1px!important;
 left:-10px!important;top:-10px!important;
 opacity:0!important;
 pointer-events:none!important;
}
a-scene,.a-canvas{
 position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;
 max-width:none!important;max-height:none!important;
}
a-scene{z-index:1!important;background:transparent!important}
.a-canvas{z-index:1!important;background:transparent!important}
.a-enter-vr,.a-enter-ar{display:none!important}
</style>
<script>
AFRAME.registerComponent('tracker-hud',{init:function(){
 const scene=this.el;
 const status=document.getElementById('status');
 const diag=document.getElementById('diag');
 const display=document.getElementById('display-video');
 const rig=document.getElementById('clamp-world');
 const pivot=document.getElementById('clamp-pivot');
 const model=document.getElementById('clamp-model');
 const markers=['m1','m2','m3','m4'].map(id=>document.getElementById(id));

 rig.setAttribute('visible',false);
 rig.object3D.visible=false;

 // Proven by the 5.5 constellation diagnostic.
 const SCENE_PER_METRE=19.437;

 // Real surveyed marker-centre positions relative to the centre of the
 // 177 x 76 mm printed footprint. X=right, Z=down the sheet.
 const localM=[
   new THREE.Vector2( 0.000000,-0.093500), // FID01 TOP
   new THREE.Vector2( 0.145590, 0.000000), // FID02 RIGHT
   new THREE.Vector2( 0.000000, 0.093650), // FID03 BOTTOM
   new THREE.Vector2(-0.146765, 0.000000)  // FID04 LEFT
 ];
 const local=localM.map(v=>new THREE.Vector2(
   v.x*SCENE_PER_METRE,
   v.y*SCENE_PER_METRE
 ));

 const TARGET_LENGTH_M=0.177;
 const TARGET_WIDTH_M=0.076;
 const TARGET_LENGTH_SCENE=TARGET_LENGTH_M*SCENE_PER_METRE;
 const TARGET_WIDTH_SCENE=TARGET_WIDTH_M*SCENE_PER_METRE;

 // -------- Camera/display plumbing: preserved from the known-good branch --------
 const attachDisplay=()=>{
   const source=document.getElementById('arjs-video');
   if(source && source.srcObject && display.srcObject!==source.srcObject){
     display.srcObject=source.srcObject;
     display.play().catch(()=>{});
   }
 };
 window.addEventListener('camera-init',()=>setTimeout(attachDisplay,50));
 window.addEventListener('arjs-video-loaded',attachDisplay);
 const streamTimer=setInterval(()=>{
   attachDisplay();
   if(display.srcObject) clearInterval(streamTimer);
 },100);

 function syncViewport(){
   const source=document.getElementById('arjs-video');
   const canvas=scene.canvas || document.querySelector('.a-canvas');
   if(!source || !canvas) return;

   const vw=source.videoWidth||640, vh=source.videoHeight||480;
   const sw=window.innerWidth, sh=window.innerHeight;
   const va=vw/vh, sa=sw/sh;
   let w,h,left,top;

   if(va>sa){
     h=sh; w=h*va; left=(sw-w)/2; top=0;
   }else{
     w=sw; h=w/va; left=0; top=(sh-h)/2;
   }

   Object.assign(display.style,{
     width:w+'px',height:h+'px',left:left+'px',top:top+'px',
     right:'auto',bottom:'auto',objectFit:'fill'
   });
   Object.assign(canvas.style,{
     position:'fixed',width:w+'px',height:h+'px',
     left:left+'px',top:top+'px',
     maxWidth:'none',maxHeight:'none',background:'transparent'
   });

   if(scene.renderer){
     const cur=scene.renderer.getSize(new THREE.Vector2());
     if(Math.abs(cur.x-w)>1 || Math.abs(cur.y-h)>1){
       scene.renderer.setSize(Math.round(w),Math.round(h),false);
     }
   }
 }
 window.addEventListener('camera-init',()=>{setTimeout(syncViewport,100);setTimeout(syncViewport,700)});
 window.addEventListener('arjs-video-loaded',()=>setTimeout(syncViewport,50));
 window.addEventListener('resize',syncViewport);
 window.addEventListener('orientationchange',()=>setTimeout(syncViewport,250));
 setInterval(syncViewport,500);

 const transparent=()=>{
   if(scene.renderer){
     scene.renderer.setClearColor(0x000000,0);
     scene.renderer.setClearAlpha(0);
     scene.renderer.domElement.style.background='transparent';
   }
 };
 scene.addEventListener('render-target-loaded',transparent);
 setTimeout(transparent,500);

 // -------- Auto-datum the GLB itself --------
 // The mesh is centred automatically in X/Z and its lowest Y point is placed
 // exactly on the mat plane. Its longest horizontal dimension is aligned with
 // the 177 mm printed rectangle and scaled from the actual GLB bounding box.
 let modelReady=false;
 let modelInfo='model loading';

 model.addEventListener('model-loaded',()=>{
   const mesh=model.getObject3D('mesh');
   if(!mesh) return;

   model.object3D.position.set(0,0,0);
   pivot.object3D.rotation.set(0,0,0);
   pivot.object3D.scale.set(1,1,1);
   scene.object3D.updateMatrixWorld(true);

   const box=new THREE.Box3().setFromObject(mesh);
   const size=new THREE.Vector3();
   const centre=new THREE.Vector3();
   box.getSize(size);
   box.getCenter(centre);

   // Datum the raw GLB: footprint centre at X/Z=0, bottom surface at Y=0.
   model.object3D.position.set(-centre.x,-box.min.y,-centre.z);

   const xIsLong=size.x>=size.z;
   const longExtent=xIsLong ? size.x : size.z;
   const widthExtent=xIsLong ? size.z : size.x;

   // If the GLB's long horizontal axis happens to be Z, rotate it onto mat X.
   const yaw=xIsLong ? 0 : Math.PI/2;
   pivot.object3D.rotation.set(0,yaw,0);

   // Physical model scale comes directly from the actual loaded GLB bounds.
   const physicalScale=TARGET_LENGTH_SCENE/longExtent;
   pivot.object3D.scale.setScalar(physicalScale);

   const resultingWidthM=(widthExtent*physicalScale)/SCENE_PER_METRE;
   const resultingHeightM=(size.y*physicalScale)/SCENE_PER_METRE;

   modelInfo=
     'GLB '+size.x.toFixed(3)+'×'+size.y.toFixed(3)+'×'+size.z.toFixed(3)+
     ' · model scale '+physicalScale.toFixed(3)+
     ' · width '+(resultingWidthM*1000).toFixed(1)+' mm'+
     ' · height '+(resultingHeightM*1000).toFixed(1)+' mm';

   modelReady=true;
 });

 // -------- Rigid mat solver, kept in AR.js native scene units --------
 const wp=new THREE.Vector3(),wq=new THREE.Quaternion(),ws=new THREE.Vector3();
 const smoothP=new THREE.Vector3(),smoothQ=new THREE.Quaternion();
 const targetP=new THREE.Vector3(),targetQ=new THREE.Quaternion();
 let havePose=false,lastGood=0,goodFrames=0,lastPairGapMm=0;

 function observed(i){
   const o=markers[i].object3D;
   o.updateMatrixWorld(true);
   o.matrixWorld.decompose(wp,wq,ws);
   return {i:i,p:wp.clone()};
 }

 function expectedDistance(i,j){
   const dx=local[i].x-local[j].x;
   const dz=local[i].y-local[j].y;
   return Math.hypot(dx,dz);
 }

 function shapeError(obs){
   if(obs.length<2) return {worst:999,mean:999};
   let worst=0,sum=0,n=0;
   for(let a=0;a<obs.length;a++){
     for(let b=a+1;b<obs.length;b++){
       const e=expectedDistance(obs[a].i,obs[b].i);
       const m=obs[a].p.distanceTo(obs[b].p);
       const frac=Math.abs(m-e)/e;
       worst=Math.max(worst,frac);
       sum+=frac; n++;
     }
   }
   return {worst:worst,mean:sum/Math.max(1,n)};
 }

 function solveMat(obs){
   if(obs.length<3) return null;

   const by={};
   obs.forEach(o=>by[o.i]=o);

   // Physical distances from marker centres to the actual footprint centre.
   const TOP_M=0.093500, BOTTOM_M=0.093650;
   const LEFT_M=0.146765, RIGHT_M=0.145590;

   const topBottomFrac=(TOP_M/(TOP_M+BOTTOM_M));
   const leftRightFrac=(LEFT_M/(LEFT_M+RIGHT_M));

   let centreTB=null, centreLR=null;

   // The centre is solved from OPPOSITE marker pairs. This is deliberately
   // independent of model origin, marker quaternion, and the LS scale fit.
   if(by[0] && by[2]){
     centreTB=by[0].p.clone().lerp(by[2].p,topBottomFrac);
   }
   if(by[3] && by[1]){
     centreLR=by[3].p.clone().lerp(by[1].p,leftRightFrac);
   }

   if(!centreTB && !centreLR) return null; // impossible for a genuine 3-of-4 cross

   const centre=(centreTB && centreLR)
     ? centreTB.clone().add(centreLR).multiplyScalar(0.5)
     : (centreTB ? centreTB.clone() : centreLR.clone());

   let pairGapMm=0;
   if(centreTB && centreLR){
     pairGapMm=(centreTB.distanceTo(centreLR)/SCENE_PER_METRE)*1000;
   }

   // Mat X axis: LEFT -> RIGHT. Any 3-of-4 set always gives either the
   // complete pair or one side marker plus the solved centre.
   let xRaw=null;
   if(by[3] && by[1]) xRaw=by[1].p.clone().sub(by[3].p);
   else if(by[1]) xRaw=by[1].p.clone().sub(centre);
   else if(by[3]) xRaw=centre.clone().sub(by[3].p);

   // Mat Z axis: TOP -> BOTTOM.
   let zRaw=null;
   if(by[0] && by[2]) zRaw=by[2].p.clone().sub(by[0].p);
   else if(by[2]) zRaw=by[2].p.clone().sub(centre);
   else if(by[0]) zRaw=centre.clone().sub(by[0].p);

   if(!xRaw || !zRaw || xRaw.length()<0.2 || zRaw.length()<0.2) return null;

   const xAxis=xRaw.normalize();

   // Orthogonalise Z to X so the virtual mat remains a rigid rectangle even
   // when individual marker depth estimates disagree slightly.
   const zAxis=zRaw.addScaledVector(xAxis,-zRaw.dot(xAxis)).normalize();
   if(zAxis.length()<0.9) return null;

   let yAxis=new THREE.Vector3().crossVectors(zAxis,xAxis).normalize();
   let zFixed=new THREE.Vector3().crossVectors(xAxis,yAxis).normalize();
   let xFixed=new THREE.Vector3().crossVectors(yAxis,zFixed).normalize();

   // Positive model Y must point above the sheet, toward the camera.
   const cameraPos=new THREE.Vector3();
   scene.camera.getWorldPosition(cameraPos);
   const toCamera=cameraPos.sub(centre);
   if(yAxis.dot(toCamera)<0){
     yAxis.negate();
     zFixed.negate();
     xFixed=new THREE.Vector3().crossVectors(yAxis,zFixed).normalize();
   }

   const basis=new THREE.Matrix4().makeBasis(xFixed,yAxis,zFixed);
   const q=new THREE.Quaternion().setFromRotationMatrix(basis);

   // Residual against the surveyed fixture geometry.
   let ss=0;
   obs.forEach(o=>{
     const pred=centre.clone()
       .addScaledVector(xFixed,local[o.i].x)
       .addScaledVector(zFixed,local[o.i].y);
     ss+=pred.distanceToSquared(o.p);
   });

   const rmsScene=Math.sqrt(ss/obs.length);
   const rmsMm=(rmsScene/SCENE_PER_METRE)*1000;

   return {p:centre,q:q,rmsMm:rmsMm,pairGapMm:pairGapMm};
 }

 function subsets3(arr){
   if(arr.length===3) return [arr];
   const out=[];
   for(let a=0;a<arr.length-2;a++)
    for(let b=a+1;b<arr.length-1;b++)
     for(let c=b+1;c<arr.length;c++)
      out.push([arr[a],arr[b],arr[c]]);
   return out;
 }

 function chooseConstellation(obs){
   if(obs.length<3) return null;

   // First choice: all four markers. The two independently solved physical
   // centres should agree. If they do, this is our strongest datum.
   if(obs.length>=4){
     const e4=shapeError(obs);
     const s4=solveMat(obs);
     if(s4 && e4.worst<0.20 && s4.rmsMm<32 && s4.pairGapMm<32){
       return {obs:obs,solved:s4,shape:e4,mode:'4-marker cross'};
     }
   }

   // If one marker is rogue or missing, every 3-of-4 subset still contains one
   // opposite pair. Pick the physically best-fitting trio.
   let best=null;
   subsets3(obs).forEach(sub=>{
     const sh=shapeError(sub);
     if(sh.worst>0.22) return;
     const sol=solveMat(sub);
     if(!sol || sol.rmsMm>34) return;
     const score=sol.rmsMm + sh.mean*45;
     if(!best || score<best.score){
       best={obs:sub,solved:sol,shape:sh,score:score,mode:'3-marker pair'};
     }
   });

   return best;
 }

 // Adaptive temporal filter: resist tiny tracking noise, but follow intentional
 // camera movement quickly. Only the FINAL rigid pose is filtered.
 function filteredAlpha(distanceScene,angleRad){
   const mm=(distanceScene/SCENE_PER_METRE)*1000;
   const deg=THREE.MathUtils.radToDeg(angleRad);
   if(mm<4 && deg<1.0) return {p:0.10,q:0.08};
   if(mm<12 && deg<3.0) return {p:0.20,q:0.16};
   return {p:0.42,q:0.34};
 }

 scene.addEventListener('renderstart',()=>{
   const loop=()=>{
     const obs=[];
     markers.forEach((m,i)=>{
       if(m.object3D.visible) obs.push(observed(i));
     });

     const chosen=chooseConstellation(obs);

     if(chosen && modelReady){
       targetP.copy(chosen.solved.p);
       targetQ.copy(chosen.solved.q);

       if(havePose && smoothQ.dot(targetQ)<0){
         targetQ.set(-targetQ.x,-targetQ.y,-targetQ.z,-targetQ.w);
       }

       goodFrames++;
       if(goodFrames>=3){
         if(!havePose){
           smoothP.copy(targetP);
           smoothQ.copy(targetQ);
           havePose=true;
         }else{
           const d=smoothP.distanceTo(targetP);
           const dot=Math.min(1,Math.max(-1,Math.abs(smoothQ.dot(targetQ))));
           const angle=2*Math.acos(dot);
           const alpha=filteredAlpha(d,angle);
           smoothP.lerp(targetP,alpha.p);
           smoothQ.slerp(targetQ,alpha.q);
         }

         rig.object3D.position.copy(smoothP);
         rig.object3D.quaternion.copy(smoothQ);
         rig.setAttribute('visible',true);
         rig.object3D.visible=true;
         lastGood=performance.now();

         lastPairGapMm=chosen.solved.pairGapMm||0;
         status.textContent='DATUM LOCK · '+chosen.obs.length+
           ' of '+obs.length+' markers';
         diag.textContent=
           chosen.mode+
           ' · RMS '+chosen.solved.rmsMm.toFixed(1)+' mm'+
           ' · worst '+(chosen.shape.worst*100).toFixed(1)+'%'+
           (chosen.solved.pairGapMm ? ' · centre gap '+chosen.solved.pairGapMm.toFixed(1)+' mm' : '')+
           '\n'+modelInfo+
           '\nvirtual footprint 177 × 76 mm · solver datum = printed rectangle centre';
       }
     }else{
       goodFrames=0;
       const age=performance.now()-lastGood;

       if(havePose && age<1200){
         rig.setAttribute('visible',true);
         rig.object3D.visible=true;
         status.textContent='REG HOLD · '+obs.length+' seen · '+Math.round(age)+' ms';
         diag.textContent='Holding last validated rigid-mat pose.\n'+modelInfo;
       }else{
         rig.setAttribute('visible',false);
         rig.object3D.visible=false;
         havePose=false;

         if(!modelReady){
           status.textContent='Loading calibration model…';
           diag.textContent=modelInfo;
         }else if(obs.length>=3){
           const sh=shapeError(obs);
           status.textContent='Geometry rejected · '+obs.length+' seen';
           diag.textContent='worst pair error '+(sh.worst*100).toFixed(1)+'%\n'+modelInfo;
         }else{
           status.textContent='Need 3 markers · '+obs.length+' seen';
           diag.textContent='Bring at least 3 fiducials into view.\n'+modelInfo;
         }
       }
     }

     requestAnimationFrame(loop);
   };
   requestAnimationFrame(loop);
 });
}});
</script>
</head>
<body>
<video id="display-video" autoplay muted playsinline></video>
<div id="hud"><div id="status">Starting camera…</div><div class="small">Prototype 5.9 · OPPOSITE-PAIR DATUM SOLVER</div><div id="diag"></div></div>
<a-scene tracker-hud embedded vr-mode-ui="enabled:false"
 renderer="antialias:true; alpha:true; precision:mediump"
 arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono;">
 <a-assets><a-asset-item id="clamp" src="clamp.glb"></a-asset-item></a-assets>
 <a-marker id="m1" type="pattern" url="fid01.patt" size="0.05824" smooth="false"></a-marker>
 <a-marker id="m2" type="pattern" url="fid02.patt" size="0.05830" smooth="false"></a-marker>
 <a-marker id="m3" type="pattern" url="fid03.patt" size="0.05484" smooth="false"></a-marker>
 <a-marker id="m4" type="pattern" url="fid04.patt" size="0.05577" smooth="false"></a-marker>
 <a-entity id="clamp-world" visible="false">

   <!-- Virtual survey rectangle. If these four bars sit on the printed
        rectangle, the MAT pose is correct independently of the GLB. -->
   <a-box position="0 0.012 -0.738606" width="3.440349" height="0.018" depth="0.024"
          material="color:#00ff88; opacity:1.0; transparent:false"></a-box>
   <a-box position="0 0.012 0.738606" width="3.440349" height="0.018" depth="0.024"
          material="color:#00ff88; opacity:1.0; transparent:false"></a-box>
   <a-box position="-1.7201745 0.012 0" width="0.024" height="0.018" depth="1.477212"
          material="color:#00ff88; opacity:1.0; transparent:false"></a-box>
   <a-box position="1.7201745 0.012 0" width="0.024" height="0.018" depth="1.477212"
          material="color:#00ff88; opacity:1.0; transparent:false"></a-box>

   <!-- The pivot receives only local GLB datum/scale corrections.
        The tracker never modifies it. -->
   <a-entity id="clamp-pivot">
     <a-entity id="clamp-model" gltf-model="#clamp"></a-entity>
   </a-entity>
 </a-entity>
 <a-entity camera></a-entity>
</a-scene>
</body>
</html>
