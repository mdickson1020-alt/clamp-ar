<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bench Clamp AR Prototype 3.2</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif}
#hud{position:fixed;z-index:10000;left:10px;right:10px;top:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.68);color:#fff;font-size:14px;pointer-events:none}
#status{font-weight:700}.small{font-size:12px;opacity:.82;margin-top:4px}
#display-video{
 position:fixed!important;inset:0!important;
 width:100vw!important;height:100vh!important;
 object-fit:cover!important;
 z-index:0!important;
 background:#000;
}
#arjs-video{
 position:fixed!important;
 width:1px!important;height:1px!important;
 left:-10px!important;top:-10px!important;
 opacity:0!important;
 pointer-events:none!important;
}
a-scene,.a-canvas{
 position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;
 max-width:none!important;max-height:none!important;
}
a-scene{z-index:1!important;background:transparent!important}
.a-canvas{z-index:1!important;background:transparent!important}
.a-enter-vr,.a-enter-ar{display:none!important}
</style>
<script>
AFRAME.registerComponent('tracker-hud',{init:function(){
 const scene=this.el,status=document.getElementById('status'),display=document.getElementById('display-video');
 const rig=document.getElementById('clamp-world'),markers=['m1','m2','m3','m4'].map(id=>document.getElementById(id));
 let active=-1,lastGood=0,candidate=-1,candidateSince=0;
 const attach=()=>{const v=document.getElementById('arjs-video');if(v&&v.srcObject&&display.srcObject!==v.srcObject){display.srcObject=v.srcObject;display.play().catch(()=>{});}};
 window.addEventListener('camera-init',()=>setTimeout(attach,50));window.addEventListener('arjs-video-loaded',attach);
 const q=setInterval(()=>{attach();if(display.srcObject)clearInterval(q)},100);

 /* Common mat coordinates, expressed in each marker's local units.
    Marker image dimensions and measured marker-to-footprint gaps are used.
    FID01: 58.24 mm marker; marker centre to footprint centre =
      29.12 + 26.38 + 38.00 = 93.50 mm => 1.60543 marker widths.
    Other transforms use their measured marker sizes/gaps and the same
    177 x 76 mm footprint centre. */
 const off=[
  [new THREE.Vector3(0,.025, 1.60543),0],
  [new THREE.Vector3(-2.56304,.025,0),-Math.PI/2],
  [new THREE.Vector3(0,.025,-1.72028),Math.PI],
  [new THREE.Vector3(2.64936,.025,0),Math.PI/2]];
 const mp=new THREE.Vector3(),mq=new THREE.Quaternion(),ms=new THREE.Vector3(),tp=new THREE.Vector3(),tq=new THREE.Quaternion(),lq=new THREE.Quaternion(),ro=new THREE.Vector3(),yaxis=new THREE.Vector3(0,1,0);

 function visible(i){return i>=0&&markers[i].object3D.visible}
 function elect(now){
   if(visible(active)){candidate=-1;return active;}
   const i=markers.findIndex(m=>m.object3D.visible);
   if(i<0){candidate=-1;return -1;}
   if(candidate!==i){candidate=i;candidateSince=now;return -1;}
   if(now-candidateSince>=350){active=i;candidate=-1;return active;}
   return -1;
 }
 const transparent=()=>{if(scene.renderer){scene.renderer.setClearColor(0,0);scene.renderer.setClearAlpha(0);scene.renderer.domElement.style.background='transparent';}};
 scene.addEventListener('render-target-loaded',transparent);setTimeout(transparent,500);

 scene.addEventListener('renderstart',()=>{
  const loop=()=>{
   const now=performance.now(),i=elect(now);
   if(i>=0){
    lastGood=now;const mo=markers[i].object3D;mo.updateMatrixWorld(true);mo.matrixWorld.decompose(mp,mq,ms);
    ro.copy(off[i][0]).applyQuaternion(mq);tp.copy(mp).add(ro);lq.setFromAxisAngle(yaxis,off[i][1]);tq.copy(mq).multiply(lq);
    if(!rig.object3D.visible){rig.object3D.position.copy(tp);rig.object3D.quaternion.copy(tq);}
    else{rig.object3D.position.lerp(tp,.10);rig.object3D.quaternion.slerp(tq,.10);}
    rig.object3D.visible=true;status.textContent='Locked to FID '+(i+1);
   } else if(active>=0 && !visible(active)){
    if(now-lastGood>1200){active=-1;}
   } else if(active<0 && now-lastGood>1800){
    rig.object3D.visible=false;status.textContent='Hold mat in view';
   }
   requestAnimationFrame(loop);
  };requestAnimationFrame(loop);
 });
}});
</script>
</head>
<body>
<video id="display-video" autoplay muted playsinline></video>
<div id="hud"><div id="status">Starting camera…</div><div class="small">Prototype 3.2 · CALIBRATED MAT + STABLE HANDOFF</div></div>
<a-scene tracker-hud embedded vr-mode-ui="enabled:false"
 renderer="antialias:true; alpha:true; precision:mediump"
 arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;">
 <a-assets><a-asset-item id="clamp" src="clamp.glb"></a-asset-item></a-assets>
 <a-marker id="m1" type="pattern" url="fid01.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-marker id="m2" type="pattern" url="fid02.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-marker id="m3" type="pattern" url="fid03.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-marker id="m4" type="pattern" url="fid04.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-entity id="clamp-world" visible="false">
   <a-entity gltf-model="#clamp" rotation="0 90 0" scale="1.71742 1.71742 1.71742"></a-entity>
 </a-entity>
 <a-entity camera></a-entity>
</a-scene>
</body>
</html>
