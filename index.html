<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bench Clamp AR Prototype 5.1</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif}
#hud{position:fixed;z-index:10000;left:10px;right:10px;top:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.68);color:#fff;font-size:14px;pointer-events:none}
#status{font-weight:700}.small{font-size:12px;opacity:.82;margin-top:4px}
#display-video{
 position:fixed!important;inset:0!important;
 width:100vw!important;height:100vh!important;
 object-fit:cover!important;
 z-index:0!important;
 background:#000;
}
#arjs-video{
 position:fixed!important;
 width:1px!important;height:1px!important;
 left:-10px!important;top:-10px!important;
 opacity:0!important;
 pointer-events:none!important;
}
a-scene,.a-canvas{
 position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;
 max-width:none!important;max-height:none!important;
}
a-scene{z-index:1!important;background:transparent!important}
.a-canvas{z-index:1!important;background:transparent!important}
.a-enter-vr,.a-enter-ar{display:none!important}
</style>
<script>
AFRAME.registerComponent('tracker-hud',{init:function(){
 const scene=this.el,status=document.getElementById('status'),display=document.getElementById('display-video');
 const rig=document.getElementById('clamp-world');
 const markers=['m1','m2','m3','m4'].map(id=>document.getElementById(id));

 const attach=()=>{const v=document.getElementById('arjs-video');if(v&&v.srcObject&&display.srcObject!==v.srcObject){display.srcObject=v.srcObject;display.play().catch(()=>{});}};
 window.addEventListener('camera-init',()=>setTimeout(attach,50));
 window.addEventListener('arjs-video-loaded',attach);
 const q=setInterval(()=>{attach();if(display.srcObject)clearInterval(q)},100);

 const mp=new THREE.Vector3(),mq=new THREE.Quaternion(),ms=new THREE.Vector3();
 const centre=new THREE.Vector3(),targetP=new THREE.Vector3(),targetQ=new THREE.Quaternion();
 const relPos=[null,null,null,null], relQuat=[null,null,null,null];
 let calibrated=false,calFrames=0,lastGood=0;
 let smoothP=new THREE.Vector3(),smoothQ=new THREE.Quaternion(),havePose=false;

 const transparent=()=>{if(scene.renderer){scene.renderer.setClearColor(0,0);scene.renderer.setClearAlpha(0);scene.renderer.domElement.style.background='transparent';}};
 scene.addEventListener('render-target-loaded',transparent);setTimeout(transparent,500);

 function getPose(i){
   const m=markers[i];
   m.object3D.updateMatrixWorld(true);
   m.object3D.matrixWorld.decompose(mp,mq,ms);
   return {i,p:mp.clone(),q:mq.clone()};
 }
 function avgQuat(arr){
   let q=arr[0].clone();
   for(let k=1;k<arr.length;k++){
     const x=arr[k].clone();
     if(q.dot(x)<0)x.set(-x.x,-x.y,-x.z,-x.w);
     q.slerp(x,1/(k+1));
   }
   return q;
 }

 scene.addEventListener('renderstart',()=>{
  const loop=()=>{
   const vis=[];
   markers.forEach((m,i)=>{if(m.object3D.visible)vis.push(getPose(i));});

   if(!calibrated){
     // Calibration needs all four genuine markers together for a short, stable burst.
     if(vis.length===4){
       calFrames++;
       status.textContent='CALIBRATING MAT · '+Math.min(calFrames,20)+'/20';
       if(calFrames>=20){
         centre.set(0,0,0);vis.forEach(x=>centre.add(x.p));centre.multiplyScalar(.25);

         // Define the mat orientation from the physical constellation itself:
         // X axis = left marker (FID04) -> right marker (FID02)
         // Z axis = top marker (FID01) -> bottom marker (FID03)
         const by={};vis.forEach(x=>by[x.i]=x);
         const xAxis=by[1].p.clone().sub(by[3].p).normalize();
         const zAxis=by[2].p.clone().sub(by[0].p).normalize();
         let yAxis=new THREE.Vector3().crossVectors(zAxis,xAxis).normalize();
         // Re-orthogonalise X against Y/Z.
         const zz=new THREE.Vector3().crossVectors(xAxis,yAxis).normalize();
         const xx=new THREE.Vector3().crossVectors(yAxis,zz).normalize();
         const mat=new THREE.Matrix4().makeBasis(xx,yAxis,zz);
         targetQ.setFromRotationMatrix(mat);

         // Store each marker's measured transform relative to this mat pose.
         const invQ=targetQ.clone().invert();
         vis.forEach(x=>{
           relPos[x.i]=x.p.clone().sub(centre).applyQuaternion(invQ);
           relQuat[x.i]=invQ.clone().multiply(x.q);
         });
         calibrated=true;havePose=false;lastGood=performance.now();
         status.textContent='CALIBRATED · move camera';
       }
     }else{
       calFrames=0;
       status.textContent='Show all 4 markers to calibrate ('+vis.length+'/4)';
     }
     rig.object3D.visible=false;
     requestAnimationFrame(loop);return;
   }

   // After calibration, every visible marker predicts the SAME mat centre/orientation.
   const predictions=[];
   vis.forEach(x=>{
     if(!relPos[x.i]||!relQuat[x.i])return;
     const matQ=x.q.clone().multiply(relQuat[x.i].clone().invert());
     const matP=x.p.clone().sub(relPos[x.i].clone().applyQuaternion(matQ));
     predictions.push({p:matP,q:matQ});
   });

   if(predictions.length){
     targetP.set(0,0,0);predictions.forEach(x=>targetP.add(x.p));targetP.multiplyScalar(1/predictions.length);
     targetQ.copy(avgQuat(predictions.map(x=>x.q)));

     // Reject predictions far from the consensus, then average again.
     const kept=predictions.filter(x=>x.p.distanceTo(targetP)<0.55);
     if(kept.length){
       targetP.set(0,0,0);kept.forEach(x=>targetP.add(x.p));targetP.multiplyScalar(1/kept.length);
       targetQ.copy(avgQuat(kept.map(x=>x.q)));

       if(!havePose){smoothP.copy(targetP);smoothQ.copy(targetQ);havePose=true;}
       else{
         const jump=smoothP.distanceTo(targetP);
         if(jump<0.6){smoothP.lerp(targetP,.18);smoothQ.slerp(targetQ,.16);}
       }
       rig.object3D.position.copy(smoothP);
       rig.object3D.quaternion.copy(smoothQ);
       rig.object3D.visible=true;
       lastGood=performance.now();
       status.textContent='MAT LOCK · '+kept.length+' marker'+(kept.length===1?'':'s');
     }
   }else if(performance.now()-lastGood>700){
     rig.object3D.visible=false;havePose=false;status.textContent='Mat lost';
   }

   requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
 });
}});
</script>
</head>
<body>
<video id="display-video" autoplay muted playsinline></video>
<div id="hud"><div id="status">Starting camera…</div><div class="small">Prototype 5.1 · SELF-CALIBRATING CONSTELLATION</div></div>
<a-scene tracker-hud embedded vr-mode-ui="enabled:false"
 renderer="antialias:true; alpha:true; precision:mediump"
 arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;">
 <a-assets><a-asset-item id="clamp" src="clamp.glb"></a-asset-item></a-assets>
 <a-marker id="m1" type="pattern" url="fid01.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-marker id="m2" type="pattern" url="fid02.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-marker id="m3" type="pattern" url="fid03.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-marker id="m4" type="pattern" url="fid04.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-entity id="clamp-world" visible="false">
   <a-entity gltf-model="#clamp" rotation="0 0 0" scale="1.25 1.25 1.25"></a-entity>
 </a-entity>
 <a-entity camera></a-entity>
</a-scene>
</body>
</html>
