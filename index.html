<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bench Clamp AR Prototype 3.0</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif}
#hud{position:fixed;z-index:10000;left:10px;right:10px;top:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.68);color:#fff;font-size:14px;pointer-events:none}
#status{font-weight:700}.small{font-size:12px;opacity:.82;margin-top:4px}
#display-video{
 position:fixed!important;inset:0!important;
 width:100vw!important;height:100vh!important;
 object-fit:cover!important;
 z-index:0!important;
 background:#000;
}
#arjs-video{
 position:fixed!important;
 width:1px!important;height:1px!important;
 left:-10px!important;top:-10px!important;
 opacity:0!important;
 pointer-events:none!important;
}
a-scene,.a-canvas{
 position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;
 max-width:none!important;max-height:none!important;
}
a-scene{z-index:1!important;background:transparent!important}
.a-canvas{z-index:1!important;background:transparent!important}
.a-enter-vr,.a-enter-ar{display:none!important}
</style>
<script>
AFRAME.registerComponent('tracker-hud',{init:function(){
 const scene=this.el, status=document.getElementById('status');
 const display=document.getElementById('display-video');
 const markers=['m1','m2','m3','m4'].map(id=>document.getElementById(id));
 const rig=document.getElementById('clamp-rig');
 let active=null, lostTimer=null;

 const attachDisplay=()=>{
   const source=document.getElementById('arjs-video');
   if(source && source.srcObject && display.srcObject!==source.srcObject){
     display.srcObject=source.srcObject; display.play().catch(()=>{});
   }
 };
 window.addEventListener('camera-init',()=>setTimeout(attachDisplay,50));
 window.addEventListener('arjs-video-loaded',attachDisplay);
 const t=setInterval(()=>{attachDisplay();if(display.srcObject)clearInterval(t)},100);

 // One virtual object only. Whichever marker is selected becomes its parent.
 // We deliberately hold the last pose briefly through short marker dropouts.
 const transforms=[
   {p:'-1.520 0.035 1.560', r:'0 0 0'},       // TOP triangle -> mat centre
   {p:'-2.523 0.035 0',     r:'0 -90 0'},     // RIGHT L -> mat centre
   {p:'-1.653 0.035 -1.653',r:'0 180 0'},     // BOTTOM T -> mat centre
   {p:'2.658 0.035 0',      r:'0 90 0'}       // LEFT staircase -> mat centre
 ];

 function adopt(i){
   if(active===i) return;
   active=i;
   clearTimeout(lostTimer);
   const m=markers[i], tr=transforms[i];
   m.appendChild(rig);
   rig.setAttribute('position',tr.p);
   rig.setAttribute('rotation',tr.r);
   rig.setAttribute('visible',true);
   status.textContent='Locked to FID '+(i+1);
 }
 markers.forEach((m,i)=>{
   m.addEventListener('markerFound',()=>{
     // Keep current anchor while it remains visible; otherwise adopt new one.
     if(active===null || !markers[active].object3D.visible) adopt(i);
   });
   m.addEventListener('markerLost',()=>{
     if(active!==i) return;
     clearTimeout(lostTimer);
     lostTimer=setTimeout(()=>{
       const replacement=markers.findIndex((x,j)=>j!==i && x.object3D.visible);
       if(replacement>=0) adopt(replacement);
       else {
         // Hide only after a meaningful loss, eliminating single-frame flashing.
         rig.setAttribute('visible',false); active=null;
         status.textContent='Hold mat in view';
       }
     },700);
   });
 });

 // Transparent augmentation framebuffer.
 const transparent=()=>{
   if(scene.renderer){
     scene.renderer.setClearColor(0x000000,0);
     scene.renderer.setClearAlpha(0);
     scene.renderer.domElement.style.background='transparent';
   }
 };
 scene.addEventListener('render-target-loaded',transparent);
 setTimeout(transparent,500);
}});
</script>
</head>
<body>
<video id="display-video" autoplay muted playsinline></video>
<div id="hud"><div id="status">Starting camera…</div><div class="small">Prototype 3.0 · FIXED MAT REGISTRATION · one stable clamp</div></div>
<a-scene tracker-hud embedded vr-mode-ui="enabled:false"
 renderer="antialias:true; alpha:true; precision:mediump"
 arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;">
 <a-assets><a-asset-item id="clamp" src="clamp.glb"></a-asset-item></a-assets>
 <a-marker id="m1" type="pattern" url="fid01.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5">
   <a-entity id="clamp-rig" position="-1.520 0.035 1.560" rotation="0 0 0" visible="false">
     <a-entity gltf-model="#clamp" scale="1.71742 1.71742 1.71742"></a-entity>
   </a-entity>
 </a-marker>
 <a-marker id="m2" type="pattern" url="fid02.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-marker id="m3" type="pattern" url="fid03.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-marker id="m4" type="pattern" url="fid04.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-entity camera></a-entity>
</a-scene>
</body>
</html>
