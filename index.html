<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bench Clamp AR Prototype 5.3</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif}
#hud{position:fixed;z-index:10000;left:10px;right:10px;top:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.68);color:#fff;font-size:14px;pointer-events:none}
#status{font-weight:700}.small{font-size:12px;opacity:.82;margin-top:4px}
#display-video{
 position:fixed!important;inset:0!important;
 width:100vw!important;height:100vh!important;
 object-fit:cover!important;
 z-index:0!important;
 background:#000;
}
#arjs-video{
 position:fixed!important;
 width:1px!important;height:1px!important;
 left:-10px!important;top:-10px!important;
 opacity:0!important;
 pointer-events:none!important;
}
a-scene,.a-canvas{
 position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;
 max-width:none!important;max-height:none!important;
}
a-scene{z-index:1!important;background:transparent!important}
.a-canvas{z-index:1!important;background:transparent!important}
.a-enter-vr,.a-enter-ar{display:none!important}
</style>
<script>
AFRAME.registerComponent('tracker-hud',{init:function(){
 const scene=this.el,status=document.getElementById('status'),display=document.getElementById('display-video');
 const rig=document.getElementById('clamp-world');
 rig.object3D.visible=false;
 const markers=['m1','m2','m3','m4'].map(id=>document.getElementById(id));
 const attach=()=>{const v=document.getElementById('arjs-video');if(v&&v.srcObject&&display.srcObject!==v.srcObject){display.srcObject=v.srcObject;display.play().catch(()=>{});}};
 window.addEventListener('camera-init',()=>setTimeout(attach,50));window.addEventListener('arjs-video-loaded',attach);
 const q=setInterval(()=>{attach();if(display.srcObject)clearInterval(q)},100);

 const mp=new THREE.Vector3(),mq=new THREE.Quaternion(),ms=new THREE.Vector3();
 const p=new THREE.Vector3(),targetP=new THREE.Vector3(),targetQ=new THREE.Quaternion();
 const smoothP=new THREE.Vector3(),smoothQ=new THREE.Quaternion();
 const relPos=[null,null,null,null],relQuat=[null,null,null,null];
 let calibrated=false,calFrames=0,havePose=false,lastGood=0;

 const transparent=()=>{if(scene.renderer){scene.renderer.setClearColor(0,0);scene.renderer.setClearAlpha(0);scene.renderer.domElement.style.background='transparent';}};
 scene.addEventListener('render-target-loaded',transparent);setTimeout(transparent,500);

 function pose(i){
   const o=markers[i].object3D;o.updateMatrixWorld(true);o.matrixWorld.decompose(mp,mq,ms);
   return {i,p:mp.clone(),q:mq.clone()};
 }
 function frameFromConstellation(by){
   // Mat frame directly from marker CENTRES, no assumptions about marker pattern rotation.
   // FID04(left)=3, FID02(right)=1, FID01(top)=0, FID03(bottom)=2.
   const x=by[1].p.clone().sub(by[3].p).normalize();
   const z=by[2].p.clone().sub(by[0].p).normalize();
   const y=new THREE.Vector3().crossVectors(z,x).normalize();
   const zz=new THREE.Vector3().crossVectors(x,y).normalize();
   const xx=new THREE.Vector3().crossVectors(y,zz).normalize();
   const m=new THREE.Matrix4().makeBasis(xx,y,zz);
   const qq=new THREE.Quaternion().setFromRotationMatrix(m);
   const cc=new THREE.Vector3();
   Object.values(by).forEach(v=>cc.add(v.p));cc.multiplyScalar(1/Object.keys(by).length);
   return {p:cc,q:qq};
 }
 function avgQuat(arr){
   let q=arr[0].clone();
   for(let k=1;k<arr.length;k++){const x=arr[k].clone();if(q.dot(x)<0)x.set(-x.x,-x.y,-x.z,-x.w);q.slerp(x,1/(k+1));}
   return q;
 }

 scene.addEventListener('renderstart',()=>{
  const loop=()=>{
   const vis=[];markers.forEach((m,i)=>{if(m.object3D.visible)vis.push(pose(i));});
   const by={};vis.forEach(v=>by[v.i]=v);

   if(!calibrated){
     if(vis.length===4){
       calFrames++;status.textContent='CALIBRATING · '+Math.min(calFrames,15)+'/15';
       if(calFrames>=15){
         const f=frameFromConstellation(by),inv=f.q.clone().invert();
         vis.forEach(v=>{
           relPos[v.i]=v.p.clone().sub(f.p).applyQuaternion(inv);
           relQuat[v.i]=inv.clone().multiply(v.q);
         });
         calibrated=true;havePose=false;lastGood=performance.now();
         status.textContent='CALIBRATED · LOCKING';
       }
     }else{calFrames=0;status.textContent='Show all 4 markers ('+vis.length+'/4)';}
     rig.object3D.visible=false;
     requestAnimationFrame(loop);return;
   }

   let solved=false;

   // STRONG MODE: if all 4 are visible, solve the live mat directly from their centres.
   if(vis.length===4){
     const f=frameFromConstellation(by);targetP.copy(f.p);targetQ.copy(f.q);solved=true;
     status.textContent='MAT LOCK · 4 markers · DIRECT';
   } else if(vis.length>=1){
     // DEGRADED MODE: calibrated marker(s) predict the mat frame.
     const preds=[];
     vis.forEach(v=>{
       if(!relPos[v.i]||!relQuat[v.i])return;
       const qmat=v.q.clone().multiply(relQuat[v.i].clone().invert());
       const pmat=v.p.clone().sub(relPos[v.i].clone().applyQuaternion(qmat));
       preds.push({p:pmat,q:qmat});
     });
     if(preds.length){
       targetP.set(0,0,0);preds.forEach(x=>targetP.add(x.p));targetP.multiplyScalar(1/preds.length);
       targetQ.copy(avgQuat(preds.map(x=>x.q)));solved=true;
       status.textContent='MAT LOCK · '+preds.length+' marker'+(preds.length===1?'':'s')+' · CAL';
     }
   }

   if(solved){
     if(!havePose){smoothP.copy(targetP);smoothQ.copy(targetQ);havePose=true;}
     else{
       // Do not freeze on large but valid camera movement; follow it, just faster.
       smoothP.lerp(targetP,.32);smoothQ.slerp(targetQ,.28);
     }
     rig.object3D.position.copy(smoothP);rig.object3D.quaternion.copy(smoothQ);
     rig.setAttribute('visible',true);
     rig.object3D.visible=true;
     rig.object3D.traverse(o=>{o.visible=true;});
     lastGood=performance.now();
   }else{
     const age=performance.now()-lastGood;
     if(havePose && age<=1200){
       // Hold the last valid mat pose through short AR.js detector flicker.
       rig.setAttribute('visible',true);
       rig.object3D.visible=true;
       status.textContent='MAT HOLD · '+Math.round(age)+' ms';
     }else{
       rig.setAttribute('visible',false);
       rig.object3D.visible=false;
       havePose=false;
       status.textContent='MAT LOST';
     }
   }

   requestAnimationFrame(loop);
  };requestAnimationFrame(loop);
 });
}});
</script>
</head>
<body>
<video id="display-video" autoplay muted playsinline></video>
<div id="hud"><div id="status">Starting camera…</div><div class="small">Prototype 5.3 · PERSISTENT DIRECT RENDER</div></div>
<a-scene tracker-hud embedded vr-mode-ui="enabled:false"
 renderer="antialias:true; alpha:true; precision:mediump"
 arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;">
 <a-assets><a-asset-item id="clamp" src="clamp.glb"></a-asset-item></a-assets>
 <a-marker id="m1" type="pattern" url="fid01.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-marker id="m2" type="pattern" url="fid02.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-marker id="m3" type="pattern" url="fid03.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-marker id="m4" type="pattern" url="fid04.patt" smooth="true" smoothCount="20" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
 <a-entity id="clamp-world" visible="true">
   <a-entity gltf-model="#clamp" rotation="0 0 0" scale="1.25 1.25 1.25"></a-entity>
 </a-entity>
 <a-entity camera></a-entity>
</a-scene>
</body>
</html>
