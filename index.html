<title>Bench Clamp AR Prototype 6.2</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif}
#hud{position:fixed;z-index:10000;left:10px;right:10px;top:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.68);color:#fff;font-size:14px;pointer-events:none}
#status{font-weight:700}.small{font-size:12px;opacity:.82;margin-top:4px}#diag{font:11px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.95;margin-top:6px;white-space:pre-wrap}
#display-video{
 position:fixed!important;inset:0!important;
 width:100vw!important;height:100vh!important;
 object-fit:cover!important;
 z-index:0!important;background:#000;
}
#arjs-video{
 position:fixed!important;width:1px!important;height:1px!important;
 left:-10px!important;top:-10px!important;opacity:0!important;pointer-events:none!important;
}
a-scene,.a-canvas{
 position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;
 max-width:none!important;max-height:none!important;
}

.a-enter-vr,.a-enter-ar{display:none!important}

<script>
AFRAME.registerComponent('single-anchor-controller',{init:function(){
 const scene=this.el;
 const status=document.getElementById('status');
 const diag=document.getElementById('diag');
 const display=document.getElementById('display-video');

 const markers=['m1','m2','m3','m4'].map(id=>document.getElementById(id));
 const datums=['d1','d2','d3','d4'].map(id=>document.getElementById(id));
 const names=['FID01 TOP','FID02 RIGHT','FID03 BOTTOM','FID04 LEFT'];

 let active=-1;
 let lastActive=-1;
 let streak=[0,0,0,0];
 let handovers=0;

 datums.forEach(d=>{d.setAttribute('visible',false); d.object3D.visible=false;});

 // -------- Camera/display plumbing: preserved from known-good 2.1 branch --------
 const attachDisplay=()=>{
   const source=document.getElementById('arjs-video');
   if(source && source.srcObject && display.srcObject!==source.srcObject){
     display.srcObject=source.srcObject;
     display.play().catch(()=>{});
   }
 };
 window.addEventListener('camera-init',()=>setTimeout(attachDisplay,50));
 window.addEventListener('arjs-video-loaded',attachDisplay);
 const streamTimer=setInterval(()=>{
   attachDisplay();
   if(display.srcObject) clearInterval(streamTimer);
 },100);

 function syncViewport(){
   const source=document.getElementById('arjs-video');
   const canvas=scene.canvas || document.querySelector('.a-canvas');
   if(!source || !canvas) return;

   const vw=source.videoWidth||640, vh=source.videoHeight||480;
   const sw=window.innerWidth, sh=window.innerHeight;
   const va=vw/vh, sa=sw/sh;
   let w,h,left,top;

   if(va>sa){
     h=sh; w=h*va; left=(sw-w)/2; top=0;
   }else{
     w=sw; h=w/va; left=0; top=(sh-h)/2;
   }

   Object.assign(display.style,{
     width:w+'px',height:h+'px',left:left+'px',top:top+'px',
     right:'auto',bottom:'auto',objectFit:'fill'
   });
   Object.assign(canvas.style,{
     position:'fixed',width:w+'px',height:h+'px',left:left+'px',top:top+'px',
     maxWidth:'none',maxHeight:'none',background:'transparent'
   });

   if(scene.renderer){
     const cur=scene.renderer.getSize(new THREE.Vector2());
     if(Math.abs(cur.x-w)>1 || Math.abs(cur.y-h)>1){
       scene.renderer.setSize(Math.round(w),Math.round(h),false);
     }
   }
 }
 window.addEventListener('camera-init',()=>{setTimeout(syncViewport,100);setTimeout(syncViewport,700)});
 window.addEventListener('arjs-video-loaded',()=>setTimeout(syncViewport,50));
 window.addEventListener('resize',syncViewport);
 window.addEventListener('orientationchange',()=>setTimeout(syncViewport,250));
 setInterval(syncViewport,500);

 const transparent=()=>{
   if(scene.renderer){
     scene.renderer.setClearColor(0x000000,0);
     scene.renderer.setClearAlpha(0);
     scene.renderer.domElement.style.background='transparent';
   }
 };
 scene.addEventListener('render-target-loaded',transparent);
 setTimeout(transparent,500);

 function setActive(next){
   if(next===active) return;
   lastActive=active;
   active=next;
   datums.forEach((d,i)=>{
     const on=(i===active);
     d.setAttribute('visible',on);
     d.object3D.visible=on;
   });
   if(lastActive>=0 && active>=0 && lastActive!==active) handovers++;
 }

 scene.addEventListener('renderstart',()=>{
   const loop=()=>{
     const visible=[];
     markers.forEach((m,i)=>{
       const on=!!m.object3D.visible;
       streak[i]=on ? Math.min(streak[i]+1,60) : 0;
       if(on) visible.push(i);
     });

     // Keep the current marker for as long as it remains tracked. This prevents
     // needless frame-to-frame swapping when several markers are simultaneously visible.
     if(active<0 || !markers[active].object3D.visible){
       let candidate=-1;
       let best=-1;
       visible.forEach(i=>{
         if(streak[i]>best){ best=streak[i]; candidate=i; }
       });
       if(candidate>=0 && streak[candidate]>=2) setActive(candidate);
       else if(visible.length===0) setActive(-1);
     }

     // If AR.js has hidden the active marker, its child is hidden automatically.
     // Explicitly keep every non-active datum off so there can never be multiple copies.
     datums.forEach((d,i)=>{
       const on=(i===active);
       if(d.object3D.visible!==on){
         d.setAttribute('visible',on);
         d.object3D.visible=on;
       }
     });

     if(active>=0 && markers[active].object3D.visible){
       const backups=visible.filter(i=>i!==active).length;
       status.textContent='SINGLE-ANCHOR LOCK · '+names[active];
       diag.textContent=
         'driver: '+names[active]+' · backups visible: '+backups+' · handovers: '+handovers+
         '\nNO pose fusion · calibrated scene scale 19.437×'+
         '\nscene scale: 19.437 units/m · surveyed offsets scaled identically'+
         '\nWHITE/MAGENTA = centre · GREEN = 177×76 mm footprint'+
         '\nCYAN/YELLOW/ORANGE/PURPLE rings = FID01/02/03/04 centres';
     }else if(visible.length){
       status.textContent='Acquiring single anchor…';
       diag.textContent='Visible markers: '+visible.map(i=>names[i]).join(', ')+
         '\nWaiting for 2 consecutive tracked frames.';
     }else{
       status.textContent='Find any fiducial · 0 seen';
       diag.textContent='Only ONE marker is required in Prototype 6.2.'+
         '\nThe other three are redundancy for handover.';
     }

     requestAnimationFrame(loop);
   };
   requestAnimationFrame(loop);
 });
}});
</script>
