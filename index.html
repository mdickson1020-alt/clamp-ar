<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bench Clamp AR Prototype 5.6</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif}
#hud{position:fixed;z-index:10000;left:10px;right:10px;top:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.68);color:#fff;font-size:14px;pointer-events:none}
#status{font-weight:700}.small{font-size:12px;opacity:.82;margin-top:4px}#diag{font:11px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.95;margin-top:6px;white-space:pre-wrap}
#display-video{
 position:fixed!important;inset:0!important;
 width:100vw!important;height:100vh!important;
 object-fit:cover!important;
 z-index:0!important;
 background:#000;
}
#arjs-video{
 position:fixed!important;
 width:1px!important;height:1px!important;
 left:-10px!important;top:-10px!important;
 opacity:0!important;
 pointer-events:none!important;
}
a-scene,.a-canvas{
 position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;
 max-width:none!important;max-height:none!important;
}
a-scene{z-index:1!important;background:transparent!important}
.a-canvas{z-index:1!important;background:transparent!important}
.a-enter-vr,.a-enter-ar{display:none!important}
</style>
<script>
AFRAME.registerComponent('tracker-hud',{init:function(){
 const scene=this.el;
 const status=document.getElementById('status');
 const diag=document.getElementById('diag');
 const display=document.getElementById('display-video');
 const rig=document.getElementById('clamp-world');
 const model=document.getElementById('clamp-model');
 const markers=['m1','m2','m3','m4'].map(id=>document.getElementById(id));

 rig.setAttribute('visible',false);
 rig.object3D.visible=false;

 // Surveyed marker-centre coordinates relative to the centre of the
 // 177 x 76 mm clamp footprint. Units here are REAL metres.
 // X = right across the sheet. Z = down the sheet.
 const local=[
   new THREE.Vector2( 0.000000,-0.093500), // FID01 TOP
   new THREE.Vector2( 0.145590, 0.000000), // FID02 RIGHT
   new THREE.Vector2( 0.000000, 0.093650), // FID03 BOTTOM
   new THREE.Vector2(-0.146765, 0.000000)  // FID04 LEFT
 ];

 const attachDisplay=()=>{
   const source=document.getElementById('arjs-video');
   if(source && source.srcObject && display.srcObject!==source.srcObject){
     display.srcObject=source.srcObject;
     display.play().catch(()=>{});
   }
 };
 window.addEventListener('camera-init',()=>setTimeout(attachDisplay,50));
 window.addEventListener('arjs-video-loaded',attachDisplay);
 const streamTimer=setInterval(()=>{
   attachDisplay();
   if(display.srcObject) clearInterval(streamTimer);
 },100);

 // Keep visible video and WebGL canvas on exactly the same 4:3 cover rectangle.
 function syncViewport(){
   const source=document.getElementById('arjs-video');
   const canvas=scene.canvas || document.querySelector('.a-canvas');
   if(!source || !canvas) return;

   const vw=source.videoWidth||640, vh=source.videoHeight||480;
   const sw=window.innerWidth, sh=window.innerHeight;
   const va=vw/vh, sa=sw/sh;
   let w,h,left,top;

   if(va>sa){
     h=sh; w=h*va; left=(sw-w)/2; top=0;
   }else{
     w=sw; h=w/va; left=0; top=(sh-h)/2;
   }

   Object.assign(display.style,{
     width:w+'px',height:h+'px',left:left+'px',top:top+'px',
     right:'auto',bottom:'auto',objectFit:'fill'
   });
   Object.assign(canvas.style,{
     position:'fixed',width:w+'px',height:h+'px',
     left:left+'px',top:top+'px',
     maxWidth:'none',maxHeight:'none',background:'transparent'
   });

   if(scene.renderer){
     const cur=scene.renderer.getSize(new THREE.Vector2());
     if(Math.abs(cur.x-w)>1 || Math.abs(cur.y-h)>1){
       scene.renderer.setSize(Math.round(w),Math.round(h),false);
     }
   }
 }
 window.addEventListener('camera-init',()=>{setTimeout(syncViewport,100);setTimeout(syncViewport,700)});
 window.addEventListener('arjs-video-loaded',()=>setTimeout(syncViewport,50));
 window.addEventListener('resize',syncViewport);
 window.addEventListener('orientationchange',()=>setTimeout(syncViewport,250));
 setInterval(syncViewport,500);

 const transparent=()=>{
   if(scene.renderer){
     scene.renderer.setClearColor(0x000000,0);
     scene.renderer.setClearAlpha(0);
     scene.renderer.domElement.style.background='transparent';
   }
 };
 scene.addEventListener('render-target-loaded',transparent);
 setTimeout(transparent,500);

 const wp=new THREE.Vector3(),wq=new THREE.Quaternion(),ws=new THREE.Vector3();
 const targetP=new THREE.Vector3(),targetQ=new THREE.Quaternion();
 const smoothP=new THREE.Vector3(),smoothQ=new THREE.Quaternion();

 let havePose=false;
 let lastGood=0;
 let smoothScale=19.437; // diagnostic result only as a sensible startup seed

 function observed(i){
   const o=markers[i].object3D;
   o.updateMatrixWorld(true);
   o.matrixWorld.decompose(wp,wq,ws);
   return {i:i,p:wp.clone()};
 }

 function expectedDistance(i,j){
   const dx=local[i].x-local[j].x;
   const dz=local[i].y-local[j].y;
   return Math.hypot(dx,dz);
 }

 function median(values){
   const a=values.slice().sort((x,y)=>x-y);
   const n=a.length;
   return n%2 ? a[(n-1)/2] : (a[n/2-1]+a[n/2])/2;
 }

 function estimateScale(obs){
   const ratios=[];
   for(let a=0;a<obs.length;a++){
     for(let b=a+1;b<obs.length;b++){
       const e=expectedDistance(obs[a].i,obs[b].i);
       if(e>0) ratios.push(obs[a].p.distanceTo(obs[b].p)/e);
     }
   }
   if(!ratios.length) return null;
   const scale=median(ratios);
   const mean=ratios.reduce((x,y)=>x+y,0)/ratios.length;
   const sd=Math.sqrt(ratios.reduce((x,r)=>x+(r-mean)*(r-mean),0)/ratios.length);
   return {scale:scale,cv:sd/mean,ratios:ratios};
 }

 function solveMat(obs){
   if(obs.length<3) return null;

   const scaleInfo=estimateScale(obs);
   if(!scaleInfo) return null;
   const scale=scaleInfo.scale;

   // Centroids in known physical mat coordinates and observed AR coordinates.
   let mx=0,mz=0;
   const mp=new THREE.Vector3();
   obs.forEach(o=>{
     mx+=local[o.i].x;
     mz+=local[o.i].y;
     mp.add(o.p);
   });
   const n=obs.length;
   mx/=n; mz/=n; mp.multiplyScalar(1/n);

   // Least-squares directions from real mat X/Z into AR scene coordinates.
   let sxx=0,szz=0,sxz=0;
   const sxp=new THREE.Vector3(),szp=new THREE.Vector3();

   obs.forEach(o=>{
     const dx=local[o.i].x-mx;
     const dz=local[o.i].y-mz;
     const dp=o.p.clone().sub(mp);
     sxx+=dx*dx; szz+=dz*dz; sxz+=dx*dz;
     sxp.addScaledVector(dp,dx);
     szp.addScaledVector(dp,dz);
   });

   const det=sxx*szz-sxz*sxz;
   if(Math.abs(det)<1e-10) return null;

   const ax=sxp.clone().multiplyScalar(szz)
     .addScaledVector(szp,-sxz).multiplyScalar(1/det);
   const az=szp.clone().multiplyScalar(sxx)
     .addScaledVector(sxp,-sxz).multiplyScalar(1/det);

   if(ax.length()<0.001 || az.length()<0.001) return null;

   // Rigid mat axes. Scale is solved separately from the diagnostic pair distances.
   const xAxis=ax.clone().normalize();
   const zAxis=az.clone().addScaledVector(xAxis,-az.dot(xAxis)).normalize();
   if(zAxis.length()<0.5) return null;

   let yAxis=new THREE.Vector3().crossVectors(zAxis,xAxis).normalize();
   let zFixed=new THREE.Vector3().crossVectors(xAxis,yAxis).normalize();
   let xFixed=new THREE.Vector3().crossVectors(yAxis,zFixed).normalize();

   // Keep the mat normal facing the camera to prevent 180-degree plane flips.
   const cameraPos=new THREE.Vector3();
   scene.camera.getWorldPosition(cameraPos);
   const approxCentre=mp.clone()
     .addScaledVector(xFixed,-scale*mx)
     .addScaledVector(zFixed,-scale*mz);
   const toCamera=cameraPos.sub(approxCentre);
   if(yAxis.dot(toCamera)<0){
     yAxis.negate();
     zFixed.negate();
     xFixed=new THREE.Vector3().crossVectors(yAxis,zFixed).normalize();
   }

   const basis=new THREE.Matrix4().makeBasis(xFixed,yAxis,zFixed);
   const quat=new THREE.Quaternion().setFromRotationMatrix(basis);

   // Rigid best-fit centre using the empirically observed scene-units/metre scale.
   const centre=mp.clone()
     .addScaledVector(xFixed,-scale*mx)
     .addScaledVector(zFixed,-scale*mz);

   // Residual, converted back into physical millimetres.
   let ss=0;
   obs.forEach(o=>{
     const pred=centre.clone()
       .addScaledVector(xFixed,scale*local[o.i].x)
       .addScaledVector(zFixed,scale*local[o.i].y);
     ss+=pred.distanceToSquared(o.p);
   });
   const rmsScene=Math.sqrt(ss/n);
   const rmsMm=(rmsScene/scale)*1000;

   return {
     p:centre,
     q:quat,
     scale:scale,
     rmsMm:rmsMm,
     cv:scaleInfo.cv
   };
 }

 scene.addEventListener('renderstart',()=>{
   const loop=()=>{
     const obs=[];
     markers.forEach((m,i)=>{
       if(m.object3D.visible) obs.push(observed(i));
     });

     const solved=obs.length>=3 ? solveMat(obs) : null;
     const valid=solved &&
       solved.scale>10 && solved.scale<30 &&
       solved.cv<0.15 &&
       solved.rmsMm<25;

     if(valid){
       targetP.copy(solved.p);
       targetQ.copy(solved.q);

       if(!havePose){
         smoothP.copy(targetP);
         smoothQ.copy(targetQ);
         smoothScale=solved.scale;
         havePose=true;
       }else{
         // Avoid quaternion hemisphere flips before interpolation.
         if(smoothQ.dot(targetQ)<0){
           targetQ.set(-targetQ.x,-targetQ.y,-targetQ.z,-targetQ.w);
         }
         smoothP.lerp(targetP,.30);
         smoothQ.slerp(targetQ,.25);
         smoothScale += (solved.scale-smoothScale)*.25;
       }

       rig.object3D.position.copy(smoothP);
       rig.object3D.quaternion.copy(smoothQ);

       // GLB is 1.77 units long. Desired physical length is 0.177 m.
       // Therefore model scalar = AR scene-units/metre * 0.1.
       const modelScale=smoothScale*0.1;
       model.object3D.scale.setScalar(modelScale);

       rig.setAttribute('visible',true);
       rig.object3D.visible=true;
       lastGood=performance.now();

       status.textContent='PHYSICAL MAT LOCK · '+obs.length+' markers';
       diag.textContent=
         'scale '+solved.scale.toFixed(3)+' scene/m'+
         '   RMS '+solved.rmsMm.toFixed(1)+' mm'+
         '   spread '+(solved.cv*100).toFixed(1)+'%\n'+
         'clamp scale '+modelScale.toFixed(3)+'   target 177 × 76 mm';
     }else{
       const age=performance.now()-lastGood;

       if(havePose && age<900){
         rig.setAttribute('visible',true);
         rig.object3D.visible=true;
         status.textContent='MAT HOLD · '+obs.length+' seen · '+Math.round(age)+' ms';
       }else{
         rig.setAttribute('visible',false);
         rig.object3D.visible=false;
         havePose=false;

         if(solved){
           status.textContent='REJECTED FIT · '+obs.length+' markers';
           diag.textContent=
             'scale '+solved.scale.toFixed(3)+' scene/m'+
             '   RMS '+solved.rmsMm.toFixed(1)+' mm'+
             '   spread '+(solved.cv*100).toFixed(1)+'%';
         }else{
           status.textContent='Need 3 markers · '+obs.length+' seen';
           diag.textContent='Waiting for a non-collinear 3-marker constellation.';
         }
       }
     }

     requestAnimationFrame(loop);
   };
   requestAnimationFrame(loop);
 });
}});
</script>
</head>
<body>
<video id="display-video" autoplay muted playsinline></video>
<div id="hud"><div id="status">Starting camera…</div><div class="small">Prototype 5.6 · NORMALISED PHYSICAL MAT SOLVER</div><div id="diag"></div></div>
<a-scene tracker-hud embedded vr-mode-ui="enabled:false"
 renderer="antialias:true; alpha:true; precision:mediump"
 arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;">
 <a-assets><a-asset-item id="clamp" src="clamp.glb"></a-asset-item></a-assets>
 <a-marker id="m1" type="pattern" url="fid01.patt" size="0.05824" smooth="false"></a-marker>
 <a-marker id="m2" type="pattern" url="fid02.patt" size="0.05830" smooth="false"></a-marker>
 <a-marker id="m3" type="pattern" url="fid03.patt" size="0.05484" smooth="false"></a-marker>
 <a-marker id="m4" type="pattern" url="fid04.patt" size="0.05577" smooth="false"></a-marker>
 <a-entity id="clamp-world" visible="false">
   <a-entity id="clamp-model" gltf-model="#clamp" position="0 0 0" rotation="0 0 0"
             scale="1.9437 1.9437 1.9437"></a-entity>
 </a-entity>
 <a-entity camera></a-entity>
</a-scene>
</body>
</html>
