<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bench Clamp AR Registration Prototype</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.min.js"></script>
<style>
html, body {
  margin: 0 !important;
  width: 100% !important;
  height: 100% !important;
  overflow: hidden !important;
  background: transparent !important;
  font-family: system-ui, Arial, sans-serif;
}
#hud {
  position: fixed;
  z-index: 10000;
  left: 10px; right: 10px; top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(0,0,0,.68);
  color: #fff;
  font-size: 14px;
  pointer-events: none;
}
#status { font-weight: 700; }
.small { font-size: 12px; opacity: .82; margin-top: 4px; }

/* 1.4: force BOTH AR.js video and A-Frame canvas onto the same viewport. */
#arjs-video {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  max-width: none !important;
  max-height: none !important;
  object-fit: cover !important;
  z-index: 0 !important;
  display: block !important;
  visibility: visible !important;
  opacity: 1 !important;
}

a-scene,
.a-canvas {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  max-width: none !important;
  max-height: none !important;
}

a-scene { z-index: 1 !important; }
.a-enter-vr, .a-enter-ar { display:none !important; }
body > div:not(#hud) { max-width:none !important; }
.a-canvas {
  z-index: 1 !important;
  background: transparent !important;
}
</style>

<script>
/*
  Prototype 1.6 tests AR.js portrait source/display dimensions rather than post-hoc CSS resizing.
  Marker/model transforms are unchanged from 1.3.
*/
AFRAME.registerComponent('tracker-hud', {
  init: function () {
    const status = document.getElementById('status');
    const active = new Set();
    const ids = ['m1','m2','m3','m4'];

    const fitLayers = () => {
      const video = document.getElementById('arjs-video');
      const canvas = document.querySelector('.a-canvas');

      if (video) {
        Object.assign(video.style, {
          position: 'fixed',
          left: '0px',
          top: '0px',
          width: window.innerWidth + 'px',
          height: window.innerHeight + 'px',
          maxWidth: 'none',
          maxHeight: 'none',
          objectFit: 'cover',
          zIndex: '0',
          display: 'block',
          visibility: 'visible',
          opacity: '1'
        });
      }

      if (canvas) {
        Object.assign(canvas.style, {
          position: 'fixed',
          left: '0px',
          top: '0px',
          width: window.innerWidth + 'px',
          height: window.innerHeight + 'px',
          maxWidth: 'none',
          maxHeight: 'none',
          zIndex: '1',
          background: 'transparent'
        });
        canvas.width = Math.round(window.innerWidth * (window.devicePixelRatio || 1));
        canvas.height = Math.round(window.innerHeight * (window.devicePixelRatio || 1));
      }

      const scene = document.querySelector('a-scene');
      if (scene) {
        Object.assign(scene.style, {
          position: 'fixed',
          left: '0px',
          top: '0px',
          width: window.innerWidth + 'px',
          height: window.innerHeight + 'px',
          maxWidth: 'none',
          maxHeight: 'none',
          margin: '0',
          padding: '0'
        });
        if (scene.renderer) {
          scene.renderer.setPixelRatio(window.devicePixelRatio || 1);
          scene.renderer.setSize(window.innerWidth, window.innerHeight, false);
        }
        if (scene.camera) {
          scene.camera.aspect = window.innerWidth / window.innerHeight;
          scene.camera.updateProjectionMatrix();
        }
        scene.resize();
      }
    };

    window.addEventListener('camera-init', () => {
      status.textContent = 'Camera ready · point at a fiducial';
      setTimeout(fitLayers, 100);
      setTimeout(fitLayers, 500);
    });
    window.addEventListener('arjs-video-loaded', () => {
      if (!active.size) status.textContent = 'Camera live · point at a fiducial';
      fitLayers();
    });
    window.addEventListener('resize', fitLayers);
    window.addEventListener('orientationchange', () => setTimeout(fitLayers, 250));

    ids.forEach((id, i) => {
      const m = document.getElementById(id);
      m.addEventListener('markerFound', () => {
        active.add(i + 1);
        status.textContent = 'Tracking FID ' + [...active].join(', ');
      });
      m.addEventListener('markerLost', () => {
        active.delete(i + 1);
        status.textContent = active.size
          ? 'Tracking FID ' + [...active].join(', ')
          : 'Camera live · point at a fiducial';
      });
    });

    setTimeout(fitLayers, 1000);
  }
});
</script>
</head>

<body>
<div id="hud">
  <div id="status">Starting camera…</div>
  <div class="small">Prototype 1.6 PORTRAIT SOURCE TEST · 480×640 source</div>
</div>

<a-scene
  tracker-hud
  embedded
  vr-mode-ui="enabled:false"
  renderer="antialias:true; alpha:true; precision:mediump"
  arjs="sourceType:webcam; sourceWidth:480; sourceHeight:640; displayWidth:480; displayHeight:640; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;">

  <a-assets>
    <a-asset-item id="clamp" src="clamp.glb"></a-asset-item>
  </a-assets>

  <a-marker id="m1" type="pattern" url="fid01.patt" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
    <a-entity gltf-model="#clamp" position="-2.455 0.04 1.560" rotation="0 0 0" scale="0.17170 0.17170 0.17170"></a-entity>
  </a-marker>

  <a-marker id="m2" type="pattern" url="fid02.patt" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
    <a-entity gltf-model="#clamp" position="-4.977 0.04 -0.117" rotation="0 0 0" scale="0.17153 0.17153 0.17153"></a-entity>
  </a-marker>

  <a-marker id="m3" type="pattern" url="fid03.patt" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
    <a-entity gltf-model="#clamp" position="-2.608 0.04 -1.653" rotation="0 0 0" scale="0.18235 0.18235 0.18235"></a-entity>
  </a-marker>

  <a-marker id="m4" type="pattern" url="fid04.patt" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
    <a-entity gltf-model="#clamp" position="2.658 0.04 -0.122" rotation="0 0 0" scale="0.17931 0.17931 0.17931"></a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
